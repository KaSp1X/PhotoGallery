<div>
  <h2 class="mb-4 text-center">Login</h2>
  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" formControlName="email">
      <div class="text-danger mt-1" *ngIf="form.controls.email.touched && form.controls.email.invalid">
        Valid email required
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" formControlName="password">
      <div class="text-danger mt-1" *ngIf="form.controls.password.touched && form.controls.password.invalid">
        Password required
      </div>
    </div>
    <div class="text-danger mb-3" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <button class="btn btn-primary w-100" [disabled]="isLoading">
      {{ isLoading ? 'Logging in...' : 'Login' }}
    </button>
  </form>
</div>
